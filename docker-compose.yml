version: '3.8'

services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: fibonacci-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
    image: fibonacci-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
